name: Build ReflectMaster APK

on:
  workflow_dispatch: # Cho phép bác bấm nút tự chạy bằng tay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11' # Dự án này khá cũ nên dùng Java 11 là an toàn nhất

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: ReflectMaster-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
